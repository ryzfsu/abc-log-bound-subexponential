# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A subexponential upper bound for log c in the abc conjecture"
  description: >-
    For every positive real epsilon, there is a positive constant C such that
    log c is at most C times rad(abc) to the power epsilon whenever
    a and b are positive coprime integers and a + b = c. The radical is the
    product of the distinct prime factors. This is an upper bound for log c.
    The abc conjecture itself remains open.
  authors: ["Ruiyi Zhang"]
  license: "Apache-2.0"
  responsible_maintainers: ["Ruiyi Zhang"]

classification:
  arxiv: ["math.NT"]
  msc2020: ["11D75", "11J86", "11L20"]

sources:
  - title: "A subexponential upper bound for log c in the abc conjecture"
    authors: ["Ruiyi Zhang"]
    type: "paper"
    id: "https://github.com/ryzfsu/abc-log-bound-subexponential"
    license: "CC-BY-4.0"
    location: "https://github.com/ryzfsu/abc-log-bound-subexponential/blob/main/main.pdf"
    relationship: "formalizes"
    note: "Theorem 1.1 of the paper."
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/ryzfsu/abc-log-bound-two-ninths"
    relationship: "builds-on"
    note: >-
      The vendored modules come from Ruiyi Zhang's Lean formalization of the
      two-ninths paper (concept DOI 10.5281/zenodo.24405683,
      https://github.com/ryzfsu/abc-log-bound-two-ninths, commit
      e10c67b33dda8d5c97d6f275d9644a3be7438ee2), under Apache 2.0.

status:
  scope: >-
    Subexp proves the full uniform statement of Theorem 1.1. The sole
    placeholder is the proof of the independent inline theorem in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["GPT-6 Astra", "Gemini 4 Neon", "Claude Fable 5"]
      framework: "Codex, Antigravity and Claude Code"
      tool_setup: >-
        The author devised the method of proof. Codex (OpenAI, GPT-6 Astra) and
        Antigravity (Google, Gemini 4 Neon) ran blind reviews of the manuscript,
        and Codex assisted with the Lean formalization. Claude Code (Anthropic,
        Claude Fable 5) checked the proofs and the
        references. The author checked every step of the proof and every
        reference, and takes full responsibility for the content of the paper.
  notes: "Build verification uses Lean and Mathlib at the pinned revisions."

fidelity:
  divergences: >-
    The main statement matches the paper. The formal proof uses a
    smooth-modulus exclusion at the contact prime and an explicit
    two-logarithm estimate for the old-prime lattice. It selects the
    auxiliary tuple and hitting prime together using finite sums and a
    Chebyshev bound. Further differences are listed in the README.

review:
  status: "author-verified"
  reviewers: ["Ruiyi Zhang"]
  notes: >-
    AI readings also compared the formalized statement and proof structure
    with the manuscript. The verification script checks the explicit theorem
    types against the retained statement definition, compares the three fixed
    definitions, and checks the solution's axiom report.

alignment:
  namespace: "AbcSubexp"
  statements:
    - source: "Theorem 1.1"
      lean: "AbcSubexp.subexp"
      module: "Subexp"
      status: "proved"
      note: "Solution imports the theorem and restates the same inline type as AbcSubexp.Solution.subexp."
